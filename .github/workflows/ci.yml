name: CI

# Runs on pull requests; on main it is called by the Release workflow before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generated types are up to date with the spec
        run: npm run generate:types && git diff --exit-code src/forge/schema.gen.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage:api
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run
